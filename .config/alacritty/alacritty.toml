
[window]
#startup_mode = "Fullscreen"
padding = { x = 0, y = 0 }
opacity = 1 

[font]
size = 13
normal = { family = "Iosevka Nerd Font", style = "Regular" }
bold = { family = "Iosevka Nerd Font", style = "Bold" }
italic = { family = "Iosevka Nerd Font", style = "Italic" }
bold_italic = { family = "Iosevka Nerd Font", style = "Bold Italic" }

[keyboard]
bindings = [
  { key = "T", mods = "Control|Shift", action = "SpawnNewInstance" },
]

# background = '#0a0c10'
# foreground = '#f0f3f6'
# Background thing
#[colors.primary]
#background = '#000000'

# Cursor color
[colors.cursor]
text = "#000000"
cursor = "#ced130"

[cursor]
style = { shape = "Block", blinking = "Always"}
blink_timeout = 0
blink_interval = 500

#normal = { family = "Iosevka Nerd Font", style = "Regular" }
#bold = { family = "Iosevka Nerd Font", style = "Bold" }
#italic = { family = "Iosevka Nerd Font", style = "Italic" }
# Colors (Ayu Dark)

# Default colors
[colors.primary]
background = '#0A0E14'
foreground = '#B3B1AD'

# Normal colors
[colors.normal]
black   = '#01060E'
red     = '#EA6C73'
green   = '#91B362'
yellow  = '#F9AF4F'
blue    = '#53BDFA'
magenta = '#FAE994'
cyan    = '#90E1C6'
white   = '#C7C7C7'

# Bright colors
[colors.bright]
black   = '#686868'
red     = '#F07178'
green   = '#C2D94C'
yellow  = '#FFB454'
blue    = '#59C2FF'
magenta = '#FFEE99'
cyan    = '#95E6CB'
white   = '#FFFFFF'#bold_italic = { family = "Iosevka Nerd Font", style = "Bold Italic" }
