icons_format = "{icon}"

[theme]
theme = "tomorrow-night"
[theme.overrides]
idle_bg = "#123456"
idle_fg = "#abcdef"

[icons]
icons = "awesome4"
[icons.overrides]
bat = ["|E|", "|_|", "|=|", "|F|"]
bat_charging = "|^| "

[[block]]
block = "focused_window"
driver = "sway_ipc"
format = " $title.str(max_w:50) | No window "

[[block]]
block = "cpu"
info_cpu = 20
warning_cpu = 50
critical_cpu = 90
[block.theme_overrides]
idle_bg = "#282828"
idle_fg = "#ebdbb2"
good_bg = "#98971a"
warning_bg = "#d79921"
critical_bg = "#cc241d"

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = "  $icon root: $available.eng(w:2) free "
[block.theme_overrides]
idle_bg = "#8db048"
idle_fg = "#2c3024"
good_bg = "#98971a"
warning_bg = "#d79921"
critical_bg = "#cc241d"

[[block]]
block = "memory"
format = " $icon $mem_total_used_percents.eng(w:2) "
format_alt = " $icon_swap $swap_used_percents.eng(w:2) "

[[block]]
block = "sound"
[[block.click]]
button = "left"
cmd = "pavucontrol"
[block.theme_overrides]
idle_bg = "#8db048"
idle_fg = "#2c3024"
good_bg = "#98971a"
warning_bg = "#d79921"
critical_bg = "#cc241d"

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'(%a) (%dd/%mm) %R') "

[[block]]
block = "net"
format = " $icon {$signal_strength $ssid $frequency|Wired connection} via $device "
[block.theme_overrides]
idle_bg = "#8db048"
idle_fg = "#2c3024"
good_bg = "#98971a"
warning_bg = "#d79921"
critical_bg = "#cc241d"
